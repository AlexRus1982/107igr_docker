version: '3.8'
services:

  # Backend контейнер
  backend:
    # Для установки нужных пакетов используем не чистый образ, а инструкции из конкретного файла Dockerfile
    build:
      context: .
      dockerfile: ./.docker/backend/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
    tty: true
    working_dir: /var/www
    volumes:
      - ./src:/var/www # Монтируем локальную папку в контейнер как /var/www
      - ./.docker/backend/php.ini:/usr/local/etc/php/php.ini
    # depends_on:
    #   - db

  # Nginx контейнер для вебсервера
  nginx:
    # Используем готовый образ для nginx контейнера
    image: nginx:alpine
    # build: ./docker/nginx
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
    tty: true
    ports:
      - "8080:80" # Внутренний порт контейнера пробрасываем на host машину
      # - "443:443"
    volumes:
      - ./src:/var/www # Монтируем локальную папку в контейнер как /var/www
      - ./.docker/nginx/conf.d/:/etc/nginx/conf.d/ # Передаем в контейнер конфигурационные файлы nginx
    depends_on:
      - backend

  # MySQL контейнер
  # db:
